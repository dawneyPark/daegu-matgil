<style>

:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171514; --surface: #211e1c; --ink: #efebe6; --muted: #a39b93;

:root[data-theme="dark"] {
  --bg: #171514; --surface: #211e1c; --ink: #efebe6; --muted: #a39b93;

* { box-sizing: border-box; }
body {

a { color: inherit; }

.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }

.list { display: flex; flex-direction: column; }

const state = { q: "", gu: "전체", cat: "전체", pick: null };

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mapQuery(p) { return encodeURIComponent("대구 " + p.name); }

function chipRow(el, items, key) {
  items.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v; b.dataset.v = v;
    b.addEventListener("click", () => { state[key] = v; state.pick = null; render(); });
    el.appendChild(b);
  });
}

function matches(p) {
  if (state.gu !== "전체" && p.gu !== state.gu) return false;
  if (state.cat !== "전체" && p.cat !== state.cat) return false;
  if (state.q) {
    const hay = [p.name, p.gu, p.dong, p.cat, p.desc, ...p.menu, ...p.ten].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function render() {
  document.querySelectorAll("#gu .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.gu));
  document.querySelectorAll("#cat .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.cat));

  const shown = PLACES.filter(matches);
  $("#count").textContent = `${shown.length}곳`;
  const list = $("#list");
  if (!shown.length) {
    list.innerHTML = `<div class="empty">조건에 맞는 곳이 없어요. 필터를 줄여 보세요.</div>`;
    return;
  }
  list.innerHTML = shown.map((p) => `
    <article class="place${state.pick === p.id ? " pick" : ""}" id="p-${p.id}">
      <div class="where"><b>${p.gu}</b><span>${esc(p.dong)}</span></div>
      <div class="body">
        <h3>${esc(p.name)} <span class="tag cat">${p.cat}</span>${p.ten.map((t) => `<span class="tag">10미 · ${t}</span>`).join("")}</h3>
        <p>${esc(p.desc)}</p>
        <ul class="menu">${p.menu.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
        <div class="tip">팁. ${esc(p.tip)}</div>
      </div>
      <div class="side">
        <span class="price" aria-label="가격대 ${p.price}단계">${price(p.price)}</span>
        <div class="links">
          <a href="https://map.naver.com/p/search/${mapQuery(p)}" target="_blank" rel="noopener">네이버 지도</a>
          <a href="https://map.kakao.com/?q=${mapQuery(p)}" target="_blank" rel="noopener">카카오맵</a>
        </div>
      </div>
    </article>`).join("");
}

$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.pick = null; render(); });
$("#reset").addEventListener("click", () => {
  Object.assign(state, { q: "", gu: "전체", cat: "전체", pick: null });
  $("#q").value = ""; render();
});
$("#random").addEventListener("click", () => {
  const pool = PLACES.filter(matches);
  const from = pool.length ? pool : PLACES;
  const p = from[Math.floor(Math.random() * from.length)];
  if (!pool.length) Object.assign(state, { q: "", gu: "전체", cat: "전체" });
  state.pick = p.id; render();
  const el = document.getElementById("p-" + p.id);
  if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
});

chipRow($("#gu"), GUS, "gu");
chipRow($("#cat"), CATS, "cat");
render();
</script>
</body>
</html>
