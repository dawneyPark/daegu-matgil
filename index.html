<style>
/* Layout: 모바일 청첩장 톤의 좁은 단일 칼럼. 가운데 정렬 인사말 → 필터 → 가게 카드 */
:root {
  --bg: #faf7f2;
  --surface: #fffdf9;
  --ink: #3a3330;
  --muted: #8a7f78;
  --line: #e9e1d7;
  --accent: #a8695c;
  --accent-soft: #f4e8e3;
  --on-accent: #fff;
  --sage: #6f7f62;
  --shadow: 0 1px 2px rgba(80, 60, 40, .05), 0 6px 20px rgba(80, 60, 40, .06);
  --font-serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1917; --surface: #252120; --ink: #eee7e1; --muted: #a89d95;
    --line: #3a3431; --accent: #d9998b; --accent-soft: #3a2723; --on-accent: #241a17; --sage: #a3b495;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1917; --surface: #252120; --ink: #eee7e1; --muted: #a89d95;
  --line: #3a3431; --accent: #d9998b; --accent-soft: #3a2723; --on-accent: #241a17; --sage: #a3b495;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 56px 48px; display: flex; flex-direction: column; gap: 36px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 인사말 */
header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.eyebrow { font-family: var(--font-serif); font-size: 12px; letter-spacing: .32em; color: var(--accent); }
h1 { font-family: var(--font-serif); font-weight: 400; font-size: clamp(28px, 7.5vw, 36px); line-height: 1.4; margin: 0; text-wrap: balance; }
.ornament { display: flex; align-items: center; gap: 10px; color: var(--accent); }
.ornament::before, .ornament::after { content: ""; width: 40px; height: 1px; background: var(--line); }
.lede { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.9; text-wrap: pretty; }

/* 찾기 */
.controls { display: flex; flex-direction: column; gap: 14px; }
.search-row { display: flex; gap: 8px; }
#q {
  flex: 1 1 auto; min-width: 0; font: inherit; padding: 11px 16px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 999px;
}
#q::placeholder { color: var(--muted); }
.chip-row { display: flex; align-items: center; gap: 10px; }
.chip-label { font-family: var(--font-serif); font-size: 13px; color: var(--muted); flex: none; width: 2.5em; }
.chips {

  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* 가게 카드 */
.list-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.list-head h2 { font-family: var(--font-serif); font-weight: 400; font-size: 20px; margin: 0; }
.count { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 14px; }
.place {

.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
.meta .cat { color: var(--accent); letter-spacing: .04em; }
.place h3 { font-family: var(--font-serif); font-weight: 700; font-size: 20px; line-height: 1.4; margin: 0; }
.ten { display: inline-block; margin-left: 6px; vertical-align: 3px; font-family: var(--font-body); font-weight: 400; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge { align-self: flex-start; font-family: var(--font-serif); font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
.badge::before { content: "♡ "; }
.place.fav { border-color: var(--accent); }
.place p { margin: 0; }
.menu { display: flex; gap: 6px; flex-wrap: wrap; padding: 0; margin: 0; list-style: none; }
.menu li { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tip { font-size: 13px; color: var(--sage); }
.tip b { font-family: var(--font-serif); font-weight: 400; margin-right: 4px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 2px; }
.price { font-size: 13px; letter-spacing: .08em; color: var(--ink); }

.links a { font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; white-space: nowrap; color: var(--muted); }
.links a:hover { border-color: var(--accent); color: var(--accent); }
.empty { padding: 32px 0; text-align: center; color: var(--muted); }

footer .thanks { font-family: var(--font-serif); font-size: 15px; color: var(--ink); margin-bottom: 8px; }

</style>

</div>

    menu: ["옥돔", "코스(예약)"], tip: "예약하면 금액에 맞춰 코스를 구성해 줘요." },
  { id: "kais", name: "카이스샌드위치샵", gu: "중구", dong: "봉산동", cat: "카페·브런치", ten: [], price: 2, badge: "직접 먹어 보고 반한 곳",
    desc: "봉산문화거리의 샌드위치 가게. 매장이 넓고 2인석과 바 좌석이 많아 혼자 가기도 편합니다.",
    menu: ["치킨팜 샌드위치", "커피"], tip: "아침 일찍 열어 브런치로 좋아요." },
  { id: "olivetable", name: "올리브테이블", gu: "중구", dong: "봉산동", cat: "카페·브런치", ten: [], price: 2, map: "대구 봉산동 올리브테이블",
    desc: "봉산동의 카페. 화덕에 구운 샌드위치를 냅니다.",
    menu: ["화덕 샌드위치", "커피"], tip: "카이스샌드위치샵, 딥커피로스터스와 같은 동네라 함께 둘러보기 좋아요." },
  { id: "deep", name: "딥커피로스터스", gu: "중구", dong: "봉산동", cat: "카페·브런치", ten: [], price: 1, badge: "직접 먹어 보고 반한 곳",
    desc: "봉산문화거리에 본점이 있는 로스터리 카페. 범어동 등 대구 안에 여러 지점이 있습니다.",
    menu: ["커피"], tip: "지점마다 주소가 다르니 본점인지 확인하고 가세요." },
  { id: "roller", name: "롤러커피", gu: "중구", dong: "남산동", cat: "카페·브런치", ten: [], price: 1, badge: "직접 먹어 보고 반한 곳",
    desc: "남산동 인쇄골목 안 작은 카페. 이름은 인쇄할 때 잉크를 바르는 롤러에서 따왔습니다.",
    menu: ["카페라떼"], tip: "점심시간엔 근처 직장인들로 줄이 생겨요." }
];

// 가게가 많은 구·군부터
const GUS = ["전체", ...Object.entries(PLACES.reduce((n, p) => ({ ...n, [p.gu]: (n[p.gu] || 0) + 1 }), {}))
  .sort((x, y) => y[1] - x[1]).map(([g]) => g)];
const CATS = ["전체", "곱창·막창", "고기", "치킨", "한식·분식", "라멘", "피자·버거", "다이닝", "카페·브런치"];
const state = { q: "", gu: "전체", cat: "전체" };

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mapQuery(p) { return encodeURIComponent(p.map || "대구 " + p.name); }

function chipRow(el, items, key) {
  items.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v; b.dataset.v = v;
    b.addEventListener("click", () => { state[key] = v; render(); });
    el.appendChild(b);
  });
}

function matches(p) {
  if (state.gu !== "전체" && p.gu !== state.gu) return false;
  if (state.cat !== "전체" && p.cat !== state.cat) return false;
  if (state.q) {
    const hay = [p.name, p.gu, p.dong, p.cat, p.desc, ...p.menu, ...p.ten].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function price(n) { return "₩₩₩".slice(0, n) + `<span class="off">${"₩₩₩".slice(n)}</span>`; }

function render() {
  document.querySelectorAll("#gu .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.gu));
  document.querySelectorAll("#cat .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.cat));

  const shown = PLACES.filter(matches);
  $("#count").textContent = `${shown.length}곳`;
  const list = $("#list");
  if (!shown.length) {
    list.innerHTML = `<div class="empty">조건에 맞는 곳이 없어요. 필터를 바꿔 보세요.</div>`;
    return;
  }
  list.innerHTML = shown.map((p) => `
    <article class="place${p.badge ? " fav" : ""}" id="p-${p.id}">
      <div class="meta"><span class="cat">${p.cat}</span><span>${p.gu} · ${esc(p.dong)}</span></div>
      ${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ""}
      <h3>${esc(p.name)}${p.ten.map((t) => `<span class="ten">대구 10미 · ${t}</span>`).join("")}</h3>
      <p>${esc(p.desc)}</p>
      <ul class="menu">${p.menu.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
      <div class="tip"><b>Tip.</b>${esc(p.tip)}</div>
      <div class="foot">
        <span class="price" aria-label="가격대 ${p.price}단계">${price(p.price)}</span>
        <div class="links">
          <a href="https://map.naver.com/p/search/${mapQuery(p)}" target="_blank" rel="noopener">네이버 지도</a>
          <a href="https://map.kakao.com/?q=${mapQuery(p)}" target="_blank" rel="noopener">카카오맵</a>
        </div>
      </div>
    </article>`).join("");
}

$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });

chipRow($("#gu"), GUS, "gu");
chipRow($("#cat"), CATS, "cat");
render();
</script>
</body>
</html>
