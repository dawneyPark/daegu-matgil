<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 맛길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 좁은 단일 칼럼 안내서. 상단에 대구 10미 띠, 아래에 필터 + 골목/가게 목록 */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1f1d1b;
  --muted: #6b655f;
  --line: #e2ddd5;
  --chili: #b8261b;
  --chili-soft: #f6e3df;
  --leaf: #3e6b3a;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171514; --surface: #211e1c; --ink: #efebe6; --muted: #a39b93;
    --line: #36312d; --chili: #ec5a4b; --chili-soft: #3a1f1b; --leaf: #8cbf7f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171514; --surface: #211e1c; --ink: #efebe6; --muted: #a39b93;
  --line: #36312d; --chili: #ec5a4b; --chili-soft: #3a1f1b; --leaf: #8cbf7f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; padding-block: 40px 64px; display: flex; flex-direction: column; gap: 40px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--chili); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--chili); font-weight: 700; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 9vw, 76px); line-height: 1; margin: 0; text-wrap: balance; }
h1 span { color: var(--chili); }
.lede { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16px; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head p { margin: 0; color: var(--muted); font-size: 13px; }

/* 대구 10미 */
.mi { display: flex; flex-direction: column; gap: 14px; }
.mi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.mi-item {
  background: var(--surface); border: 0; padding: 14px 12px; text-align: left; cursor: pointer;
  font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.mi-item:hover { background: var(--chili-soft); }
.mi-item[aria-pressed="true"] { background: var(--chili); color: #fff; }
.mi-item[aria-pressed="true"] small { color: #fff; opacity: .85; }
.mi-item strong { font-size: 16px; }
.mi-item small { color: var(--muted); font-size: 12px; line-height: 1.4; }
@media (max-width: 640px) { .mi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 필터 */
.controls { display: flex; flex-direction: column; gap: 12px; }
.search-row { display: flex; gap: 8px; flex-wrap: wrap; }
#q {
  flex: 1 1 220px; min-width: 0; font: inherit; padding: 10px 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 6px;
}
.btn {
  font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--chili); background: var(--chili); color: #fff;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; align-self: center; margin-right: 4px; min-width: 3em; }

/* 목록 */
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.place {
  display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px 20px;
  padding-block: 22px; border-top: 1px solid var(--line);
}
.place:last-child { border-bottom: 1px solid var(--line); }
.place.pick { background: var(--chili-soft); margin-inline: -12px; padding-inline: 12px; border-radius: 8px; }
.where { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; }
.where b { color: var(--ink); font-size: 15px; }
.body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.body h3 { margin: 0; font-size: 19px; line-height: 1.35; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--chili-soft); color: var(--chili); letter-spacing: .02em; }
.tag.cat { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.body p { margin: 0; max-width: 62ch; }
.menu { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); padding: 0; margin: 0; list-style: none; }
.menu li::before { content: "· "; color: var(--chili); }
.tip { font-size: 13px; color: var(--leaf); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.price { font-family: var(--font-mono); font-size: 14px; letter-spacing: .05em; }
.price .off { color: var(--line); }
.links { display: flex; gap: 6px; }
.links a { font-size: 12px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 4px; text-decoration: none; white-space: nowrap; }
.links a:hover { border-color: var(--ink); }
.fav { background: none; border: 0; cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 0; font-family: inherit; }
.fav[aria-pressed="true"] { color: var(--chili); font-weight: 700; }
.empty { padding: 32px 0; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  .place { grid-template-columns: minmax(0, 1fr); }
  .where { flex-direction: row; gap: 8px; align-items: baseline; }
  .side { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
}
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
footer p { margin: 0 0 4px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .place.pick { transition: background .3s; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">DAEGU FOOD GUIDE · 8개 구·군</div>
    <h1>대구 <span>맛길</span></h1>
    <p class="lede">찜갈비부터 납작만두까지. 대구 사람들이 손님 오면 데려가는 골목과 시장, 오래된 가게를 지역과 메뉴별로 정리했습니다.</p>
  </header>

  <section class="mi" aria-labelledby="mi-h">
    <div class="section-head">
      <h2 id="mi-h">대구 10미(味)</h2>
      <p>대구시가 지정한 대표 음식 10가지. 누르면 관련 가게만 보여요.</p>
    </div>
    <div class="mi-grid" id="mi"></div>
  </section>

  <section class="controls" aria-label="찾기">
    <div class="search-row">
      <input id="q" type="search" placeholder="메뉴, 동네, 가게 이름 (예: 막창, 서문시장)" aria-label="검색">
      <button class="btn" id="random" type="button">오늘 뭐 먹지?</button>
      <button class="btn ghost" id="reset" type="button">초기화</button>
    </div>
    <div class="chips" id="gu"><span class="chip-label">지역</span></div>
    <div class="chips" id="cat"><span class="chip-label">종류</span></div>
  </section>

  <section aria-labelledby="list-h" style="display:flex;flex-direction:column;gap:12px">
    <div class="section-head">
      <h2 id="list-h">골목과 가게</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </section>

  <footer>
    <p>가격대: ₩ 1만원 이하 · ₩₩ 1~2만원 · ₩₩₩ 2만원 이상 (1인 기준, 대략).</p>
    <p>영업시간과 휴무일은 자주 바뀝니다. 방문 전 지도 링크에서 최신 정보를 확인하세요.</p>
  </footer>
</div>

<script>
const TEN = [
  { name: "찜갈비", desc: "양은냄비에 매운 양념 소갈비찜" },
  { name: "따로국밥", desc: "밥과 국을 따로 내는 소고기 국밥" },
  { name: "막창구이", desc: "연탄불 소·돼지 막창, 된장 소스" },
  { name: "뭉티기", desc: "뭉텅 썬 생소고기, 마늘 양념장" },
  { name: "복어불고기", desc: "콩나물과 볶는 매콤한 복어" },
  { name: "논메기매운탕", desc: "논에서 키운 메기 매운탕" },
  { name: "누른국수", desc: "밀가루·콩가루 반죽 칼국수" },
  { name: "무침회", desc: "오징어·고둥을 초장에 버무린 회" },
  { name: "야끼우동", desc: "해물·채소 볶은 매운 볶음우동" },
  { name: "납작만두", desc: "얇게 부친 만두에 간장·고춧가루" }
];

const PLACES = [
  { id: "dongin", name: "동인동 찜갈비 골목", gu: "중구", dong: "동인동", cat: "고기", ten: ["찜갈비"], price: 3,
    desc: "1960~70년대부터 찜갈비 집이 모여 생긴 골목. 찌그러진 양은냄비에 마늘과 고춧가루를 듬뿍 넣어 맵게 찌는 게 대구식입니다.",
    menu: ["매운 찜갈비", "순한 찜갈비", "남은 양념에 밥 비비기"], tip: "맵기를 고를 수 있는 집이 많아요. 처음이면 보통맛부터." },
  { id: "anjirang", name: "안지랑 곱창골목", gu: "남구", dong: "대명동", cat: "고기", ten: ["막창구이"], price: 1,
    desc: "안지랑역 근처에 곱창·막창 집이 줄지어 선 골목. 저렴한 가격 덕분에 저녁이면 학생과 직장인으로 북적입니다.",
    menu: ["돼지 막창", "양념 곱창", "볶음밥"], tip: "막창은 바싹 구워 된장 소스에 파·고추를 얹어 먹어요." },
  { id: "pyeonghwa", name: "평화시장 닭똥집 골목", gu: "동구", dong: "신암동", cat: "시장", ten: [], price: 1,
    desc: "닭똥집(모래주머니) 튀김이 처음 시작된 곳으로 알려진 골목. 후라이드, 양념, 간장 맛으로 한 접시씩 시켜 나눠 먹습니다.",
    menu: ["똥집 튀김", "양념 똥집", "닭 튀김"], tip: "반반 주문이 되는 곳이 많아요." },
  { id: "bangogae", name: "반고개 무침회 골목", gu: "서구", dong: "내당동", cat: "해산물", ten: ["무침회"], price: 2,
    desc: "데친 오징어와 고둥, 미나리, 무를 새콤달콤한 초고추장에 버무리는 대구식 무침회 전문점이 모인 골목입니다.",
    menu: ["무침회", "무침회 비빔밥", "포장 무침회"], tip: "포장해 가는 손님이 많아 포장 전용 메뉴도 있어요." },
  { id: "seomun", name: "서문시장", gu: "중구", dong: "대신동", cat: "시장", ten: ["누른국수", "납작만두"], price: 1,
    desc: "대구에서 가장 큰 전통시장. 낮에는 칼국수·누른국수 노점이, 밤에는 야시장 먹거리 매대가 열립니다.",
    menu: ["누른국수", "칼제비", "납작만두", "야시장 꼬치"], tip: "국수 노점은 점심 무렵이 가장 붐벼요. 야시장 운영일은 방문 전에 확인." },
  { id: "miseong", name: "미성당 납작만두", gu: "중구", dong: "남산동", cat: "분식", ten: ["납작만두"], price: 1,
    desc: "대구 납작만두를 대표하는 오래된 가게. 당면과 부추를 조금 넣어 얇게 부친 만두에 간장, 고춧가루, 파를 뿌려 냅니다.",
    menu: ["납작만두", "쫄면"], tip: "쫄면이나 떡볶이에 곁들여 먹는 게 대구식이에요." },
  { id: "gukil", name: "국일따로국밥", gu: "중구", dong: "중구 도심", cat: "국밥·국수", ten: ["따로국밥"], price: 1,
    desc: "해방 직후부터 이어져 온 따로국밥 노포. 대파와 무를 넉넉히 넣은 얼큰한 소고기 국에 밥을 따로 내줍니다.",
    menu: ["따로국밥", "선지 따로국밥"], tip: "이른 아침 해장으로 찾는 손님이 많아요." },
  { id: "bukseong", name: "북성로 연탄불고기", gu: "중구", dong: "북성로", cat: "고기", ten: ["야끼우동"], price: 1,
    desc: "공구 상가가 문을 닫는 저녁이면 연탄불 석쇠 불고기 포장마차가 들어서는 거리. 근처 중식당에서 야끼우동도 맛볼 수 있습니다.",
    menu: ["석쇠 돼지불고기", "우동", "야끼우동(인근 중식당)"], tip: "밤늦게까지 문 여는 곳이 많아 2차로 좋아요." },
  { id: "deulan", name: "들안길 먹거리타운", gu: "수성구", dong: "두산동·상동", cat: "고기", ten: ["복어불고기", "뭉티기"], price: 3,
    desc: "수성못 근처 큰길을 따라 한정식, 고깃집, 복어 요리집이 늘어선 대구 대표 먹거리 거리. 가족 모임이나 손님 대접 장소로 많이 찾습니다.",
    menu: ["한정식", "복어불고기", "한우 구이·뭉티기"], tip: "주차장 있는 대형 식당이 많아 차로 가기 편해요." },
  { id: "dalseong", name: "달성 논메기매운탕 마을", gu: "달성군", dong: "달성군 일대", cat: "해산물", ten: ["논메기매운탕"], price: 2,
    desc: "논에서 기른 메기로 끓이는 매운탕 집이 시 외곽 달성군 곳곳에 있습니다. 수제비를 넣어 칼칼하게 끓여 냅니다.",
    menu: ["논메기매운탕", "메기찜", "수제비 추가"], tip: "외곽이라 차로 가는 게 편해요. 비슬산·송해공원 나들이와 묶어 보세요." },
  { id: "kimkwangseok", name: "김광석 다시그리기길 · 방천시장", gu: "중구", dong: "대봉동", cat: "카페", ten: [], price: 1,
    desc: "가수 김광석을 기리는 벽화 골목과 오래된 방천시장이 붙어 있는 산책 코스. 골목 안 작은 카페와 분식집을 둘러보기 좋습니다.",
    menu: ["카페", "분식", "시장 간식"], tip: "동성로에서 걸어서 갈 수 있어요." },
  { id: "apsan", name: "앞산 카페거리", gu: "남구", dong: "대명동", cat: "카페", ten: [], price: 2,
    desc: "앞산 자락 아래 카페와 브런치집, 디저트 가게가 모인 거리. 앞산 전망대 케이블카와 묶어 반나절 코스로 좋습니다.",
    menu: ["브런치", "디저트", "핸드드립"], tip: "주말 오후엔 주차가 어려워요." }
];

const GUS = ["전체", "중구", "남구", "동구", "서구", "북구", "수성구", "달서구", "달성군"];
const CATS = ["전체", "고기", "국밥·국수", "해산물", "분식", "시장", "카페"];
const state = { q: "", gu: "전체", cat: "전체", ten: null, pick: null };

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("daegu-favs") || "[]")); } catch (e) {}
function saveFavs() { try { localStorage.setItem("daegu-favs", JSON.stringify([...favs])); } catch (e) {} }

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mapQuery(p) { return encodeURIComponent("대구 " + p.name); }

function chipRow(el, items, key) {
  items.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v; b.dataset.v = v;
    b.addEventListener("click", () => { state[key] = v; state.pick = null; render(); });
    el.appendChild(b);
  });
}

function buildTen() {
  const el = $("#mi");
  TEN.forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mi-item"; b.dataset.v = t.name;
    b.innerHTML = `<strong>${t.name}</strong><small>${t.desc}</small>`;
    b.addEventListener("click", () => { state.ten = state.ten === t.name ? null : t.name; state.pick = null; render(); });
    el.appendChild(b);
  });
}

function matches(p) {
  if (state.gu !== "전체" && p.gu !== state.gu) return false;
  if (state.cat !== "전체" && p.cat !== state.cat) return false;
  if (state.ten && !p.ten.includes(state.ten)) return false;
  if (state.q) {
    const hay = [p.name, p.gu, p.dong, p.cat, p.desc, ...p.menu, ...p.ten].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function price(n) { return "₩₩₩".slice(0, n) + `<span class="off">${"₩₩₩".slice(n)}</span>`; }

function render() {
  document.querySelectorAll("#gu .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.gu));
  document.querySelectorAll("#cat .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.cat));
  document.querySelectorAll(".mi-item").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.ten));

  const shown = PLACES.filter(matches).sort((a, b) => (favs.has(b.id) - favs.has(a.id)));
  $("#count").textContent = `${shown.length}곳` + (favs.size ? ` · 찜 ${favs.size}` : "");
  const list = $("#list");
  if (!shown.length) {
    const extra = state.ten ? ` <a href="https://map.naver.com/p/search/${encodeURIComponent("대구 " + state.ten)}" target="_blank" rel="noopener">네이버 지도에서 '대구 ${state.ten}' 찾아보기</a>` : "";
    list.innerHTML = `<div class="empty">조건에 맞는 곳이 없어요. 필터를 줄여 보세요.${extra}</div>`;
    return;
  }
  list.innerHTML = shown.map((p) => `
    <article class="place${state.pick === p.id ? " pick" : ""}" id="p-${p.id}">
      <div class="where"><b>${p.gu}</b><span>${esc(p.dong)}</span></div>
      <div class="body">
        <h3>${esc(p.name)} <span class="tag cat">${p.cat}</span>${p.ten.map((t) => `<span class="tag">10미 · ${t}</span>`).join("")}</h3>
        <p>${esc(p.desc)}</p>
        <ul class="menu">${p.menu.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
        <div class="tip">팁. ${esc(p.tip)}</div>
      </div>
      <div class="side">
        <span class="price" aria-label="가격대 ${p.price}단계">${price(p.price)}</span>
        <div class="links">
          <a href="https://map.naver.com/p/search/${mapQuery(p)}" target="_blank" rel="noopener">네이버 지도</a>
          <a href="https://map.kakao.com/?q=${mapQuery(p)}" target="_blank" rel="noopener">카카오맵</a>
        </div>
        <button class="fav" type="button" data-id="${p.id}" aria-pressed="${favs.has(p.id)}">${favs.has(p.id) ? "♥ 찜함" : "♡ 찜하기"}</button>
      </div>
    </article>`).join("");
}

$("#list").addEventListener("click", (e) => {
  const b = e.target.closest(".fav");
  if (!b) return;
  const id = b.dataset.id;
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs(); render();
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.pick = null; render(); });
$("#reset").addEventListener("click", () => {
  Object.assign(state, { q: "", gu: "전체", cat: "전체", ten: null, pick: null });
  $("#q").value = ""; render();
});
$("#random").addEventListener("click", () => {
  const pool = PLACES.filter(matches);
  const from = pool.length ? pool : PLACES;
  const p = from[Math.floor(Math.random() * from.length)];
  if (!pool.length) Object.assign(state, { q: "", gu: "전체", cat: "전체", ten: null });
  state.pick = p.id; render();
  const el = document.getElementById("p-" + p.id);
  if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
});

chipRow($("#gu"), GUS, "gu");
chipRow($("#cat"), CATS, "cat");
buildTen();
render();
</script>
</body>
</html>
